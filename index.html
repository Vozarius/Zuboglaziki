<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#11151b">
    <title>Зубоглазики — Minecraft</title>
    <link rel="icon" type="image/png" href="4server-icon1.png">

    <style>
        @font-face {
            font-family: "Minecraft";
            src: url("minecraft.ttf") format("truetype");
            font-style: normal;
            font-weight: 400;
            font-display: swap;
        }

        :root {
            color-scheme: dark;
            --font: "Minecraft", "Courier New", monospace;
            --text-shadow: 2px 2px 0 #252525;
            --menu-width: 620px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
        }

        body {
            position: relative;
            display: grid;
            min-height: 100vh;
            min-height: 100svh;
            padding: 30px 18px;
            place-items: center;
            overflow-x: hidden;
            background: #11151b;
            color: #fff;
            font-family: var(--font);
            text-shadow: var(--text-shadow);
        }

        .panorama-layer,
        .panorama-shade {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .panorama-layer {
            z-index: 0;
            overflow: hidden;
            background: #27394b;
        }

        .panorama-layer.is-fallback {
            background-image: url("panorama/panorama_2.png");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
        }

        .panorama-canvas {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            z-index: 0;
            filter: blur(1.5px) brightness(0.72) saturate(0.88);
            transform: scale(1.015);
        }

        .panorama-shade {
            z-index: 1;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(5, 10, 20, 0.18), rgba(5, 8, 14, 0.38));
        }

        .main-menu {
            position: relative;
            z-index: 2;
            display: flex;
            width: min(100%, 660px);
            flex-direction: column;
            align-items: center;
            margin: auto;
            text-align: center;
        }

        .logo-stage {
            position: relative;
            width: min(86vw, 860px);
            margin-bottom: clamp(16px, 3vh, 30px);
        }

        .logo {
            display: block;
            width: 100%;
            height: auto;
            filter: drop-shadow(4px 5px 0 rgba(0, 0, 0, 0.58));
        }

        .splash {
            position: absolute;
            top: 26%;
            right: -1.5%;
            max-width: 34%;
            color: #ffff45;
            font-size: clamp(12px, 1.65vw, 20px);
            line-height: 1.3;
            text-align: center;
            text-shadow: 2px 2px 0 #3f3f00, 0 0 5px rgba(0, 0, 0, 0.6);
            transform: rotate(-18deg);
            transform-origin: center;
            opacity: 1;
            animation: splash-pulse 0.5s ease-in-out infinite;
        }

        @keyframes splash-pulse {
            0%, 100% { transform: rotate(-18deg) scale(1); }
            50% { transform: rotate(-18deg) scale(1.07); }
        }

        .server-entry {
            display: grid;
            width: min(100%, var(--menu-width));
            grid-template-columns: 48px minmax(0, 1fr) 72px 24px;
            align-items: center;
            gap: 12px;
            padding: 8px 10px;
            border: 1px solid transparent;
            border-radius: 0;
            background: rgba(0, 0, 0, 0.08);
            color: inherit;
            cursor: pointer;
            font: inherit;
            text-align: left;
        }

        .server-entry:hover,
        .server-entry:focus-visible {
            border-color: rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.16);
            outline: none;
        }

        .server-entry:active {
            background: rgba(255, 255, 255, 0.24);
        }

        .server-icon {
            display: block;
            width: 48px;
            height: 48px;
            image-rendering: pixelated;
        }

        .server-copy {
            min-width: 0;
            line-height: 1.35;
        }

        .server-name {
            display: block;
            margin-bottom: 4px;
            font-size: 18px;
        }

        .server-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 2px 12px;
            margin-bottom: 3px;
        }

        .server-version {
            color: rgba(255, 255, 255, 0.72);
            font-size: 12px;
        }

        .server-address {
            color: #d5d5d5;
            font-size: 13px;
        }

        .ip-address {
            color: #55ffff;
            cursor: pointer;
            overflow-wrap: anywhere;
        }

        .ip-address:hover {
            color: #fff;
        }

        .copy-hint {
            display: block;
            margin-top: 0;
            color: rgba(255, 255, 255, 0.72);
            font-size: 11px;
            line-height: 1.3;
        }

        .ping-state {
            display: grid;
            min-width: 64px;
            justify-items: center;
            gap: 4px;
            color: #e5e5e5;
            font-size: 12px;
            text-align: center;
        }

        .ping-icon {
            display: block;
            width: 20px;
            height: 16px;
            image-rendering: pixelated;
        }

        .ping-value {
            min-height: 1.4em;
            color: #d0d0d0;
            font-size: 12px;
            white-space: nowrap;
        }

        .server-join {
            display: block;
            width: 16px;
            height: 16px;
            visibility: hidden;
            image-rendering: pixelated;
        }

        .server-entry:hover .server-join,
        .server-entry:focus-visible .server-join,
        .server-entry[data-copied="true"] .server-join {
            visibility: visible;
        }

        .menu-buttons {
            display: flex;
            width: 100%;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .menu-button {
            position: relative;
            display: flex;
            width: min(100%, var(--menu-width));
            min-height: 46px;
            align-items: center;
            justify-content: center;
            padding: 4px 8px;
            border: 8px solid transparent;
            border-image-source: url("sprites/button.png");
            border-image-slice: 4 fill;
            border-image-width: 8px;
            border-image-repeat: stretch;
            background: transparent;
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-size: clamp(14px, 0.85vw, 16px);
            line-height: 1.35;
            text-align: center;
            text-decoration: none;
            text-shadow: 2px 2px 0 #111;
            image-rendering: pixelated;
            transition: none;
        }

        .menu-button:hover,
        .menu-button:focus-visible {
            border-image-source: url("sprites/button_highlighted.png");
            color: #ffffa0;
        }

        .menu-button:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 3px;
        }

        .menu-button:active:not(:disabled):not([aria-disabled="true"]) {
            color: #ffff55;
        }

        .button-label {
            display: block;
            max-width: 100%;
        }

        .menu-button:disabled,
        .menu-button[aria-disabled="true"] {
            cursor: not-allowed;
            color: #fff;
            opacity: 1;
        }

        .map-icon {
            position: absolute;
            left: 9px;
            width: 24px;
            height: 24px;
            image-rendering: pixelated;
        }

        .request-feedback {
            min-height: 1.5em;
            margin: 10px 0 0;
            color: #ffff55;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }

        .panorama-error {
            position: fixed;
            z-index: 3;
            right: 12px;
            bottom: 12px;
            left: 12px;
            width: fit-content;
            max-width: min(640px, calc(100vw - 24px));
            margin-inline: auto;
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.76);
            color: #fff;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }

        @media (max-width: 600px) {
            body {
                padding: 22px 14px;
            }

            .main-menu {
                width: 100%;
                max-width: 430px;
            }

            .logo-stage {
                width: min(92vw, 600px);
                margin-bottom: 18px;
            }

            .splash {
                font-size: clamp(11px, 3vw, 16px);
            }

            .server-entry {
                grid-template-columns: 40px minmax(0, 1fr) 58px 20px;
                gap: 7px;
                padding: 8px;
            }

            .server-icon {
                width: 40px;
                height: 40px;
            }

            .server-name {
                font-size: 14px;
            }

            .server-address {
                font-size: 10px;
            }

            .server-version {
                font-size: 9px;
            }

            .copy-hint {
                font-size: 9px;
            }

            .ping-state {
                min-width: 54px;
            }

            .ping-value {
                font-size: 9px;
            }

            .request-feedback {
                font-size: 10px;
            }
        }

        @media (max-height: 720px) and (min-width: 601px) {
            body {
                padding-block: 14px;
            }

            .logo-stage {
                width: min(72vw, 680px);
                margin-bottom: 12px;
            }

        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <div class="panorama-layer" aria-hidden="true">
        <canvas class="panorama-canvas" id="panorama-canvas"></canvas>
    </div>
    <div class="panorama-shade" aria-hidden="true"></div>
    <div class="panorama-error" id="panorama-error" role="status" hidden></div>

    <main class="main-menu">
        <div class="logo-stage">
            <img src="Logo.png" alt="Зубоглазики" class="logo">
            <span class="splash" id="splash" aria-label="Случайная фраза">Загружаем мир…</span>
        </div>

        <section class="server-entry" id="server-entry" role="button" tabindex="0" aria-label="Зубоглазики — скопировать адрес сервера" title="Нажмите на строку, чтобы скопировать адрес">
            <img src="4server-icon1.png" alt="" class="server-icon">
            <div class="server-copy">
                <strong class="server-name">Зубоглазики</strong>
                <div class="server-meta">
                    <span class="server-version">Minecraft NeoForge 1.21.1</span>
                    <span class="server-address">Адрес: <span class="ip-address" id="ip">Загрузка…</span></span>
                </div>
                <span class="copy-hint" id="copy-hint" aria-live="polite">Нажмите на строку, чтобы скопировать адрес</span>
            </div>
            <div class="ping-state" id="server-status" data-state="checking" role="status" aria-live="polite" title="Пинг от сервера сайта до игрового порта">
                <img class="ping-icon" id="ping-icon" src="sprites/pinging_1.png" alt="Проверяем пинг">
                <span class="ping-value" id="ping-value">Проверяем…</span>
            </div>
            <img class="server-join" id="server-join" src="sprites/join.png" alt="">
        </section>

        <nav class="menu-buttons" aria-label="Главное меню">
            <a href="https://www.dropbox.com/scl/fi/2n6ldss2pns80wi7gqmyq/mods.zip?rlkey=l59t2zqzispqxslbamwu57icf&st=i0uuzs6r&dl=1" class="menu-button" target="_blank" rel="noopener noreferrer">
                <span class="button-label">Скачать / обновить моды</span>
            </a>
            <a href="#" id="map-link" class="menu-button" aria-disabled="true" title="Укажите MAP_PORT в локальном файле .env">
                <img src="sprites/map.png" alt="" class="map-icon">
                <span class="button-label">Посмотреть карту</span>
            </a>
            <button type="button" id="request-button" class="menu-button">Запросить включение сервера</button>
            <a href="https://discord.gg/3G9GUxy9zC" class="menu-button" target="_blank" rel="noopener noreferrer">Discord</a>
        </nav>

        <p class="request-feedback" id="request-feedback" aria-live="polite"></p>
    </main>

    <script>
        const ipElement = document.getElementById("ip");
        const serverEntry = document.getElementById("server-entry");
        const joinIcon = document.getElementById("server-join");
        const copyHint = document.getElementById("copy-hint");
        const statusPanel = document.getElementById("server-status");
        const pingIcon = document.getElementById("ping-icon");
        const pingValue = document.getElementById("ping-value");
        const mapLink = document.getElementById("map-link");
        const requestButton = document.getElementById("request-button");
        const requestFeedback = document.getElementById("request-feedback");
        const splashElement = document.getElementById("splash");
        const panoramaCanvas = document.getElementById("panorama-canvas");
        const panoramaLayer = document.querySelector(".panorama-layer");
        const panoramaError = document.getElementById("panorama-error");
        const reducedMotionPreference = window.matchMedia("(prefers-reduced-motion: reduce)");
        let serverIsOnline = false;
        let pingAnimationTimer = null;
        let pingFrame = 1;
        let copyFeedbackTimer = null;

        async function loadSplash() {
            const fallback = [
                "Криперы не кусаются!", "Алмазы уже близко!",
                "Время приключений!", "Держи кирку наготове!", "Зомби тоже игроки?",
                "Построй что-нибудь!", "Смотри под ноги!", "Тут водятся зубоглазики!",
            ];
            try {
                const response = await fetch("splashes.txt", { cache: "no-cache" });
                if (!response.ok) throw new Error("Фразы не найдены.");
                const lines = (await response.text()).split(/\r?\n/).map((line) => line.trim()).filter((line) => line && !line.startsWith("#"));
                if (lines.length) splashElement.textContent = lines[Math.floor(Math.random() * lines.length)];
                else splashElement.textContent = fallback[Math.floor(Math.random() * fallback.length)];
            } catch {
                splashElement.textContent = fallback[Math.floor(Math.random() * fallback.length)];
            }
        }

        function compileShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                const message = gl.getShaderInfoLog(shader);
                gl.deleteShader(shader);
                throw new Error(message || "Не удалось собрать шейдер панорамы.");
            }
            return shader;
        }

        async function loadCubeFace(url) {
            return new Promise((resolve, reject) => {
                const image = new Image();
                image.onload = () => resolve(image);
                image.onerror = () => reject(new Error(`Не удалось загрузить ${url}`));
                image.src = url;
            });
        }

        async function setupPanorama() {
            const gl = panoramaCanvas.getContext("webgl", { alpha: false, antialias: false, depth: false, stencil: false });
            if (!gl) throw new Error("Браузер не смог создать WebGL-контекст.");

            const vertexSource = `
                attribute vec2 a_position;
                varying vec2 v_position;
                void main() {
                    v_position = a_position;
                    gl_Position = vec4(a_position, 0.0, 1.0);
                }
            `;
            const fragmentSource = `
                precision mediump float;
                varying vec2 v_position;
                uniform samplerCube u_panorama;
                uniform float u_aspect;
                uniform float u_tan_half_fov;
                uniform float u_yaw;
                uniform float u_pitch;
                void main() {
                    vec3 direction = normalize(vec3(v_position.x * u_aspect * u_tan_half_fov, v_position.y * u_tan_half_fov, 1.0));
                    float cp = cos(u_pitch);
                    float sp = sin(u_pitch);
                    direction = vec3(direction.x, direction.y * cp - direction.z * sp, direction.y * sp + direction.z * cp);
                    float cy = cos(u_yaw);
                    float sy = sin(u_yaw);
                    direction = vec3(direction.x * cy + direction.z * sy, direction.y, -direction.x * sy + direction.z * cy);
                    vec4 color = textureCube(u_panorama, direction);
                    gl_FragColor = vec4(color.rgb, 1.0);
                }
            `;

            const vertexShader = compileShader(gl, gl.VERTEX_SHADER, vertexSource);
            const fragmentShader = compileShader(gl, gl.FRAGMENT_SHADER, fragmentSource);
            const program = gl.createProgram();
            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program) || "Не удалось создать панораму.");
            gl.useProgram(program);

            const vertices = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
            const buffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
            gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
            const position = gl.getAttribLocation(program, "a_position");
            gl.enableVertexAttribArray(position);
            gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

            const faceFiles = [
                // Загружаем исходники по порядку: 0 север, 1 восток, 2 юг,
                // 3 запад, 4 верх, 5 низ; в этой проекции север — +Z, юг — -Z.
                ["panorama/panorama_0.png", gl.TEXTURE_CUBE_MAP_POSITIVE_Z],
                ["panorama/panorama_1.png", gl.TEXTURE_CUBE_MAP_POSITIVE_X],
                ["panorama/panorama_2.png", gl.TEXTURE_CUBE_MAP_NEGATIVE_Z],
                ["panorama/panorama_3.png", gl.TEXTURE_CUBE_MAP_NEGATIVE_X],
                ["panorama/panorama_4.png", gl.TEXTURE_CUBE_MAP_POSITIVE_Y],
                ["panorama/panorama_5.png", gl.TEXTURE_CUBE_MAP_NEGATIVE_Y],
            ];
            const images = await Promise.all(faceFiles.map(([url]) => loadCubeFace(url)));
            const texture = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_CUBE_MAP, texture);
            // Для граней cubemap вертикальный flip переворачивает землю и небо местами.
            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
            faceFiles.forEach(([, target], index) => gl.texImage2D(target, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, images[index]));
            gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

            const uniforms = {
                panorama: gl.getUniformLocation(program, "u_panorama"),
                aspect: gl.getUniformLocation(program, "u_aspect"),
                fov: gl.getUniformLocation(program, "u_tan_half_fov"),
                yaw: gl.getUniformLocation(program, "u_yaw"),
                pitch: gl.getUniformLocation(program, "u_pitch"),
            };
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_CUBE_MAP, texture);
            gl.uniform1i(uniforms.panorama, 0);

            const startedAt = performance.now();
            let panoramaYaw = 0;
            let canvasWidth = 0;
            let canvasHeight = 0;
            function draw(now) {
                const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
                const width = Math.round(window.innerWidth * dpr);
                const height = Math.round(window.innerHeight * dpr);
                if (width !== canvasWidth || height !== canvasHeight) {
                    canvasWidth = width;
                    canvasHeight = height;
                    panoramaCanvas.width = width;
                    panoramaCanvas.height = height;
                    gl.viewport(0, 0, width, height);
                }
                gl.uniform1f(uniforms.aspect, width / height);
                // Вертикальный FOV камеры — 90°; uniform хранит тангенс половины угла.
                gl.uniform1f(uniforms.fov, Math.tan(45 * Math.PI / 180));
                // Половина скорости Minecraft Java 1.21.1: spin += tickDelta * 0.05° за кадр.
                // Эмулируем tickDelta как фазу 20 TPS; при включённом reduced motion камера остаётся неподвижной.
                if (!reducedMotionPreference.matches) {
                    const tickDelta = ((now - startedAt) % 50) / 50;
                    panoramaYaw += tickDelta * 0.05 * (Math.PI / 180);
                }
                gl.uniform1f(uniforms.yaw, panoramaYaw % (Math.PI * 2));
                gl.uniform1f(uniforms.pitch, 0.1745329);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                requestAnimationFrame(draw);
            }
            requestAnimationFrame(draw);
        }

        function setPingChecking() {
            clearInterval(pingAnimationTimer);
            statusPanel.dataset.state = "checking";
            pingValue.textContent = "Проверяем…";
            pingIcon.alt = "Проверяем пинг";
            pingFrame = 1;
            pingIcon.src = `sprites/pinging_${pingFrame}.png`;
            pingAnimationTimer = setInterval(() => {
                pingFrame = pingFrame % 5 + 1;
                pingIcon.src = `sprites/pinging_${pingFrame}.png`;
            }, 160);
        }

        function setPingUnreachable() {
            clearInterval(pingAnimationTimer);
            statusPanel.dataset.state = "offline";
            pingIcon.src = "sprites/unreachable.png";
            pingIcon.alt = "Сервер недоступен";
            pingValue.textContent = "Недоступен";
        }

        function getPingLevel(pingMs) {
            if (pingMs <= 75) return 5;
            if (pingMs <= 150) return 4;
            if (pingMs <= 300) return 3;
            if (pingMs <= 600) return 2;
            return 1;
        }

        function setPingAvailable(pingMs) {
            clearInterval(pingAnimationTimer);
            statusPanel.dataset.state = "online";
            const level = getPingLevel(pingMs);
            pingIcon.src = `sprites/ping_${level}.png`;
            pingIcon.alt = `Пинг ${pingMs} мс, уровень ${level} из 5`;
            pingValue.textContent = `${pingMs} мс`;
        }

        async function loadPublicConfig() {
            try {
                const response = await fetch("api/config", { cache: "no-store" });
                if (!response.ok) throw new Error("Не удалось загрузить настройки сайта.");
                const config = await response.json();
                ipElement.textContent = config.serverAddress;
                if (config.mapUrl) {
                    mapLink.href = config.mapUrl;
                    mapLink.target = "_blank";
                    mapLink.rel = "noopener noreferrer";
                    mapLink.removeAttribute("aria-disabled");
                    mapLink.removeAttribute("title");
                }
            } catch {
                ipElement.textContent = "Адрес недоступен";
            }
        }

        async function refreshServerStatus() {
            setPingChecking();
            try {
                const response = await fetch("api/status", { cache: "no-store" });
                if (!response.ok) throw new Error("Статус недоступен.");
                const status = await response.json();
                serverIsOnline = status.isOpen;
                if (serverIsOnline) setPingAvailable(status.pingMs ?? 0);
                else setPingUnreachable();
                requestButton.disabled = serverIsOnline;
                requestButton.title = serverIsOnline ? "Сервер уже работает" : "Отправить запрос администраторам";
            } catch {
                serverIsOnline = false;
                setPingUnreachable();
                pingIcon.alt = "Не удалось получить статус сервера";
                requestButton.disabled = false;
            }
        }

        function updateJoinIcon() {
            if (serverEntry.dataset.copied === "true") return;
            joinIcon.src = joinIcon.matches(":hover")
                ? "sprites/join_highlighted.png"
                : "sprites/join.png";
        }

        async function copyAddress() {
            const address = ipElement.textContent.trim();
            if (!address || address === "Загрузка…" || address === "Адрес недоступен") return;
            clearTimeout(copyFeedbackTimer);
            delete serverEntry.dataset.copied;
            updateJoinIcon();
            try {
                try {
                    await navigator.clipboard.writeText(address);
                } catch {
                    const temporaryInput = document.createElement("textarea");
                    temporaryInput.value = address;
                    temporaryInput.style.position = "fixed";
                    temporaryInput.style.opacity = "0";
                    document.body.appendChild(temporaryInput);
                    temporaryInput.select();
                    const copied = document.execCommand("copy");
                    temporaryInput.remove();
                    if (!copied) throw new Error("Буфер обмена недоступен.");
                }
                copyHint.textContent = "Адрес скопирован";
                serverEntry.dataset.copied = "true";
                joinIcon.src = "sprites/accept.png";
                clearTimeout(copyFeedbackTimer);
                copyFeedbackTimer = setTimeout(() => {
                    copyHint.textContent = "Нажмите на строку, чтобы скопировать адрес";
                    delete serverEntry.dataset.copied;
                    updateJoinIcon();
                }, 1300);
            } catch {
                copyHint.textContent = "Не удалось скопировать адрес";
                clearTimeout(copyFeedbackTimer);
                copyFeedbackTimer = setTimeout(() => {
                    copyHint.textContent = "Нажмите на строку, чтобы скопировать адрес";
                }, 1800);
            }
        }

        serverEntry.addEventListener("click", copyAddress);
        serverEntry.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                copyAddress();
            }
        });
        joinIcon.addEventListener("pointerenter", updateJoinIcon);
        joinIcon.addEventListener("pointerleave", updateJoinIcon);
        serverEntry.addEventListener("pointermove", updateJoinIcon);
        mapLink.addEventListener("click", (event) => {
            if (mapLink.getAttribute("aria-disabled") === "true") event.preventDefault();
        });
        requestButton.addEventListener("click", async () => {
            if (requestButton.disabled) return;
            requestButton.disabled = true;
            requestFeedback.textContent = "Отправляем запрос…";
            try {
                const response = await fetch("api/request-start", { method: "POST" });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || "Не удалось отправить запрос.");
                requestFeedback.textContent = result.message;
            } catch (error) {
                requestFeedback.textContent = error instanceof TypeError
                    ? "Не удалось связаться с сервером сайта."
                    : (error.message || "Не удалось отправить запрос. Попробуйте позже.");
            } finally {
                requestButton.disabled = serverIsOnline;
            }
        });

        loadSplash();
        loadPublicConfig();
        refreshServerStatus();
        setInterval(refreshServerStatus, 30000);
        setupPanorama().catch((error) => {
            console.error("Не удалось запустить вращение 3D-панорамы:", error);
            panoramaCanvas.style.display = "none";
            panoramaLayer.classList.add("is-fallback");
            panoramaError.textContent = window.location.protocol === "file:"
                ? "Страница открыта как файл. Запустите npm start и откройте http://localhost:3000 — так загрузятся панорама и статус сервера."
                : `Не удалось запустить 3D-панораму: ${error.message || "ошибка WebGL"}`;
            panoramaError.hidden = false;
        });
    </script>
</body>
</html>
